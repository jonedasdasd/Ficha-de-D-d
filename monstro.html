<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Ficha de Monstro/NPC</title>
<style>
  :root{
    --bg:#1b1712; --panel:#2a231b; --panel2:#332b21; --ink:#f1e6d0; --ink-dim:#c9b99a;
    --accent:#b3502b; --accent2:#d97a3f; --border:#4a3d2c; --good:#5c8a5c;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Georgia',serif;background:var(--bg);color:var(--ink);}
  .wrap{max-width:960px;margin:0 auto;padding:18px 16px 40px;}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:18px;}
  h2{color:var(--accent2);font-size:18px;margin:0 0 12px;border-bottom:1px solid var(--border);padding-bottom:8px;}
  label{display:block;font-size:12px;color:var(--ink-dim);margin-bottom:4px;margin-top:10px;}
  input[type=text], input[type=number]{background:var(--panel2);border:1px solid var(--border);color:var(--ink);
     padding:6px 8px;border-radius:4px;font-family:inherit;font-size:13px;width:100%;}
  .row{display:flex;gap:8px;flex-wrap:wrap;}
  button.action{background:var(--accent);border:none;color:#fff;padding:9px 18px;border-radius:4px;
     cursor:pointer;font-family:inherit;font-size:13px;}
  button.action:hover{background:var(--accent2);}
  button.ghost{background:transparent;border:1px solid var(--border);color:var(--ink-dim);padding:7px 14px;
     border-radius:4px;cursor:pointer;font-family:inherit;font-size:13px;}
  .kv{display:flex;justify-content:space-between;font-size:14px;padding:5px 0;border-bottom:1px dotted var(--border);}
  .kv b{color:var(--ink);}
  .small{font-size:11px;color:var(--ink-dim);}
</style>
<body>
<div class="wrap">
  <div id="content"></div>
</div>

<script src="dados.js"></script>
<script src="token-status.js"></script>
<script src="eventos.js"></script>
<script src="monstro.js"></script>
</body>
</html>
