<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Criador de Personagens D&D 5e (2024)</title>
<style>
  :root{
    --bg:#1b1712; --panel:#2a231b; --panel2:#332b21; --ink:#f1e6d0; --ink-dim:#c9b99a;
    --accent:#b3502b; --accent2:#d97a3f; --border:#4a3d2c; --good:#5c8a5c;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Georgia',serif;background:var(--bg);color:var(--ink);}
  .wrap{max-width:960px;margin:0 auto;padding:24px 20px 60px;}
  h1{font-size:26px;letter-spacing:1px;text-align:center;margin:0 0 4px;color:var(--accent2);
     text-transform:uppercase;font-weight:normal;}
  .subtitle{text-align:center;color:var(--ink-dim);font-size:13px;margin-bottom:24px;font-style:italic;}
  .steps{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap;justify-content:center;}
  .step-btn{background:var(--panel);border:1px solid var(--border);color:var(--ink-dim);
     padding:8px 14px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:13px;}
  .step-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .step-btn.done{color:var(--good);}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:20px;margin-bottom:16px;}
  h2{color:var(--accent2);font-size:19px;margin:0 0 14px;border-bottom:1px solid var(--border);padding-bottom:8px;}
  h3{color:var(--ink);font-size:15px;margin:16px 0 8px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;}
  .card{background:var(--panel2);border:1px solid var(--border);border-radius:5px;padding:12px;cursor:pointer;transition:.15s;}
  .card:hover{border-color:var(--accent2);}
  .card.selected{border-color:var(--accent);background:#3d2c1e;}
  .card b{color:var(--accent2);font-size:15px;}
  .card .meta{font-size:12px;color:var(--ink-dim);margin-top:4px;line-height:1.5;}
  .tag{display:inline-block;background:#443727;color:var(--ink-dim);font-size:11px;padding:1px 6px;border-radius:3px;margin:2px 3px 0 0;}
  label{display:block;font-size:12px;color:var(--ink-dim);margin-bottom:4px;margin-top:10px;}
  select, input[type=text], input[type=number]{background:var(--panel2);border:1px solid var(--border);color:var(--ink);
     padding:6px 8px;border-radius:4px;font-family:inherit;font-size:13px;width:100%;}
  input[type=checkbox]{margin-right:6px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  .col{flex:1;min-width:140px;}
  button.action{background:var(--accent);border:none;color:#fff;padding:9px 18px;border-radius:4px;
     cursor:pointer;font-family:inherit;font-size:13px;}
  button.action:hover{background:var(--accent2);}
  button.ghost{background:transparent;border:1px solid var(--border);color:var(--ink-dim);padding:9px 18px;
     border-radius:4px;cursor:pointer;font-family:inherit;font-size:13px;}
  .nav{display:flex;justify-content:space-between;margin-top:16px;}
  .statgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;text-align:center;margin:12px 0;}
  .statbox{background:var(--panel2);border:1px solid var(--border);border-radius:5px;padding:8px 4px;}
  .statbox .lbl{font-size:11px;color:var(--ink-dim);}
  .statbox .val{font-size:20px;color:var(--accent2);}
  .statbox .mod{font-size:12px;color:var(--good);}
  .pool-warning{color:#d99; font-size:12px;}
  .sheet{background:#211b14;border:2px solid var(--accent);border-radius:8px;padding:18px;}
  .sheet-header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--border);padding-bottom:8px;margin-bottom:12px;}
  .sheet-header .name{font-size:22px;color:var(--accent2);}
  .sheet-header .meta{color:var(--ink-dim);font-size:13px;}
  .kv{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;border-bottom:1px dotted var(--border);}
  .kv b{color:var(--ink);}
  .skill-list{font-size:12.5px;}
  .featurebox{background:var(--panel2);border-left:3px solid var(--accent);padding:8px 12px;margin:6px 0;font-size:13px;}
  .inv-item{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px dotted var(--border);font-size:13px;}
  .inv-item button{background:none;border:none;color:#c66;cursor:pointer;font-size:14px;}
  textarea{width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--ink);border-radius:4px;
     padding:8px;font-family:inherit;font-size:13px;min-height:60px;}
  .xpbar{background:var(--panel2);border-radius:6px;height:14px;overflow:hidden;border:1px solid var(--border);}
  .xpbar-fill{background:var(--accent);height:100%;}
  .small{font-size:11px;color:var(--ink-dim);}

  .dice-btn{background:var(--panel);border:1px solid var(--border);color:var(--ink);cursor:pointer;
    border-radius:4px;font-size:12px;padding:1px 5px;line-height:1.6;}
  .dice-btn:hover{border-color:var(--accent2);}
  .dice-res{font-size:11px;color:var(--accent2);min-width:60px;display:inline-block;}
  .dice-res.rolling{color:var(--ink-dim);}

  .tipword{position:relative;border-bottom:1px dotted var(--ink-dim);cursor:pointer;}
  .tipicon{font-size:10px;color:var(--accent2);}
  .tipbox{display:none;position:absolute;left:0;top:120%;z-index:20;width:240px;background:#100d09;
    border:1px solid var(--accent);border-radius:5px;padding:8px 10px;font-size:11.5px;color:var(--ink-dim);
    box-shadow:0 4px 14px rgba(0,0,0,.5);}
  .tipword.open .tipbox{display:block;}

  .slotbox{display:inline-block;width:16px;height:16px;border:1px solid var(--accent2);border-radius:3px;
    margin:2px;cursor:pointer;}
  .slotbox.used{background:var(--accent);}

  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;
    align-items:center;justify-content:center;padding:20px;}
  .modal-overlay.open{display:flex;}
  .modal-box{background:var(--panel);border:2px solid var(--accent);border-radius:8px;padding:18px;
    max-width:560px;max-height:80vh;overflow:auto;width:100%;}

  .sheet.hp-low .sheet-header .name{color:#d97a3f;}
  .sheet.hp-low{border-color:#c07a2b;}
  .sheet.hp-zero{border-color:#a03030;}
  .sheet.hp-zero .sheet-header{border-bottom-color:#a03030;}

  details summary{list-style:none;}
  details summary::-webkit-details-marker{display:none;}
</style>
<body>
<div class="wrap">
  <h1>Painel do Mestre</h1>
  <div class="subtitle">D&D 5ª Edição — Regras 2024 · integrado ao Owlbear Rodeo</div>
  <p id="obrStatus" class="small" style="margin:6px 0 14px"></p>
  <div id="content"></div>
</div>

<script src="dados.js"></script>
<script src="mestre.js"></script>
</body>
</html>
